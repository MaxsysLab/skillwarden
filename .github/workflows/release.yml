name: Release
# A version tag (vX.Y.Z) sets this off. It builds the package from the tagged commit,
# writes the list of what it was built and tested with (an SBOM), attests where and how
# the files were built (provenance), publishes the GitHub release, and then checks the
# published files the way a user would. The build half also runs on every pull request,
# so a change that breaks the build is seen long before a release needs it.
#
# How a maintainer cuts a release, and how anyone verifies one: docs/REFERENCE.md,
# "Releases".
on:
  push:
    tags: ["v*"]
  pull_request:

# Least privilege by default; each job opts into what it needs.
permissions: {}

env:
  # The release is built with one known uv, checked against its published checksum
  # (uv-x86_64-unknown-linux-gnu.tar.gz). Nothing bumps this pin: raise it by hand,
  # with the new checksum, when a newer uv is wanted.
  RELEASE_UV_VERSION: "0.13.5"
  RELEASE_UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag-object: ${{ steps.tag.outputs.object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release is cut from an annotated, signed tag on a commit of main, named
      # after the version in the files. Anything else stops here, before a single
      # file is built. These checks catch mistakes; they run from the tagged commit,
      # so they are not a defence against someone who can push to the repository.
      - name: The tag is fit to release from
        id: tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_notes.py check "$TAG"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r '.object.type' <<<"$ref")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag. A release needs an annotated, signed tag."
            exit 1
          fi
          object=$(jq -r '.object.sha' <<<"$ref")
          if ! [[ "$object" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not read the tag object of $TAG."
            exit 1
          fi
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object")
          if [ "$(jq -r '.verification.verified' <<<"$tag_object")" != "true" ]; then
            echo "::error::$TAG is not signed with a key GitHub can verify ($(jq -r '.verification.reason' <<<"$tag_object"))."
            exit 1
          fi
          if [ "$(jq -r '.object.sha' <<<"$tag_object")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG does not point at the commit that was checked out."
            exit 1
          fi
          # A commit of a branch that was merged into main is in main's history, but it
          # was never main. Only a commit main itself has pointed at will do.
          if ! git rev-list --first-parent origin/main | grep -qx "$(git rev-parse HEAD)"; then
            echo "::error::$TAG is not on a commit of main. Tag origin/main, not a branch that was merged into it."
            exit 1
          fi
          echo "object=$object" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.RELEASE_UV_VERSION }}
          checksum: ${{ env.RELEASE_UV_SHA256 }}
      - name: Set up Python
        run: uv python install 3.12
      - name: Build the wheel and the source archive
        run: uv build --python 3.12 --out-dir dist
      # The packages in uv.lock, which is what the tests ran with and what `uv sync`
      # installs. The optional extras are not in it.
      - name: Write the parts list (SBOM, CycloneDX)
        run: |
          version=$(python3 scripts/release_notes.py version)
          uv export --frozen --no-dev --format cyclonedx1.5 --quiet \
            --output-file "dist/skillwarden-${version}.cdx.json"
          test -s "dist/skillwarden-${version}.cdx.json"
      # Fails when the version in the files has no dated entry in CHANGELOG.md, or the
      # entry cannot be carried into release notes as it is written.
      - name: Write the release notes from the changelog
        run: python3 scripts/release_notes.py notes "$(python3 scripts/release_notes.py version)" > release-notes.md
      # The wheel a user would install, in an environment with nothing else in it.
      - name: The wheel installs and runs on its own
        run: |
          version=$(python3 scripts/release_notes.py version)
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          "$RUNNER_TEMP/clean/bin/skillwarden" --version | grep -Fx "SkillWarden ${version}"
          set +e
          "$RUNNER_TEMP/clean/bin/skillwarden" scan tests/fixtures/malicious_skill --no-llm
          [ "$?" -eq 1 ] || { echo "the malicious sample was not refused"; exit 1; }
          "$RUNNER_TEMP/clean/bin/skillwarden" scan tests/fixtures/benign_skill --no-llm
          [ "$?" -eq 0 ] || { echo "the benign sample did not pass"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            release-notes.md
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # sign the attestations (Sigstore, keyless)
      attestations: write   # store them with the repository
    steps:
      # Checked first, so that nothing is attested for a tag that changed under the
      # run, and once more right before the release is created.
      - name: The tag is still the one that was built from
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.build.outputs.tag-object }}
        run: |
          now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [ -z "$TAG_OBJECT" ] || [ "$now" != "$TAG_OBJECT" ]; then
            echo "::error::$TAG is not the tag this run was built from. Nothing was attested or published."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Exactly one wheel, one source archive, one parts list
        id: files
        run: |
          set -- dist/*.cdx.json
          [ "$#" -eq 1 ] && [ -s "$1" ] || { echo "::error::expected one parts list in dist/"; exit 1; }
          echo "sbom=$1" >> "$GITHUB_OUTPUT"
          [ "$(ls dist/*.whl | wc -l)" -eq 1 ] && [ "$(ls dist/*.tar.gz | wc -l)" -eq 1 ] \
            || { echo "::error::expected one wheel and one source archive in dist/"; exit 1; }
          test -s release-notes.md
      - name: Attest where and how the files were built (provenance)
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Attest the parts list against the package (SBOM)
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: ${{ steps.files.outputs.sbom }}
      # Checked against the attestations just made, before anything is published.
      - name: The attestations verify
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          for file in dist/*.whl dist/*.tar.gz dist/*.cdx.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --bundle "$PROVENANCE"
          done
          for file in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --bundle "$SBOM" \
              --predicate-type https://cyclonedx.org/bom
          done
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.build.outputs.tag-object }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          # The tag must still be the one that was checked and built from.
          now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          if [ -z "$TAG_OBJECT" ] || [ "$now" != "$TAG_OBJECT" ]; then
            echo "::error::$TAG is not the tag this run was built from. Nothing was published."
            exit 1
          fi
          # An earlier attempt may have published the release and failed after it. If
          # the published files are the ones built here, there is nothing left to do.
          # (This call answers only for a published release, never for a draft.)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
            for file in dist/*.whl dist/*.tar.gz dist/*.cdx.json; do
              cmp "$file" "$RUNNER_TEMP/published/$(basename "$file")" \
                || { echo "::error::$TAG is already published with different files. Re-run only the failed jobs, not all of them."; exit 1; }
            done
            echo "$TAG is already published with these files."
            exit 0
          fi
          # The two attestations travel with the files, for checking without GitHub's
          # attestation store.
          cp "$PROVENANCE" "dist/skillwarden-${version}.provenance.sigstore.json"
          cp "$SBOM" "dist/skillwarden-${version}.sbom.sigstore.json"
          cat > footer.md <<EOF

          ---

          The wheel, the source archive and the parts list (.cdx.json) were built from the signed tag by the release workflow of this repository. The two .sigstore.json files are the signed statements of that. To check one of the three:

              gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$TAG

          What each file is, and what a pass tells you: [docs/REFERENCE.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/REFERENCE.md#releases).
          EOF
          cat release-notes.md footer.md > body.md
          # 1.2.0rc1, 1.2.0a1, 1.2.0b1 and 1.2.0.dev1 are pre-releases, and never "latest".
          flags=()
          case "$version" in
            *[0-9]a[0-9]* | *[0-9]b[0-9]* | *rc[0-9]* | *.dev[0-9]*) flags=(--prerelease --latest=false) ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SkillWarden ${version}" --notes-file body.md "${flags[@]}" \
            dist/*.whl dist/*.tar.gz dist/*.cdx.json dist/*.sigstore.json

  # What a user gets: the published files, downloaded fresh on a clean machine.
  verify:
    name: Check the published release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.RELEASE_UV_VERSION }}
          checksum: ${{ env.RELEASE_UV_SHA256 }}
      - name: Set up Python
        run: uv python install 3.12
      - name: Download the published files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published
      - name: The published files carry attestations made by this workflow at this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # GitHub's store can take a moment to show an attestation that was just made.
          check() {
            for attempt in 1 2 3; do
              if gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --predicate-type "$2" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
                --source-ref "refs/tags/$TAG"; then
                return 0
              fi
              echo "attempt $attempt failed for $1"
              if [ "$attempt" -lt 3 ]; then sleep 20; fi
            done
            return 1
          }
          for file in published/*.whl published/*.tar.gz published/*.cdx.json; do
            check "$file" https://slsa.dev/provenance/v1
          done
          for file in published/*.whl published/*.tar.gz; do
            check "$file" https://cyclonedx.org/bom
          done
          # The attestations that travel with the files check the same files.
          for file in published/*.whl published/*.tar.gz published/*.cdx.json; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --bundle published/*.provenance.sigstore.json
          done
          for file in published/*.whl published/*.tar.gz; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --bundle published/*.sbom.sigstore.json --predicate-type https://cyclonedx.org/bom
          done
      - name: The published wheel installs and runs on its own
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" published/*.whl
          "$RUNNER_TEMP/clean/bin/skillwarden" --version | grep -Fx "SkillWarden ${TAG#v}"
          set +e
          "$RUNNER_TEMP/clean/bin/skillwarden" scan tests/fixtures/malicious_skill --no-llm
          [ "$?" -eq 1 ] || { echo "the malicious sample was not refused"; exit 1; }
          "$RUNNER_TEMP/clean/bin/skillwarden" scan tests/fixtures/benign_skill --no-llm
          [ "$?" -eq 0 ] || { echo "the benign sample did not pass"; exit 1; }
