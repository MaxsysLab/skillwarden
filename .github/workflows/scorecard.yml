name: Scorecard
# OpenSSF Scorecard: the project's supply-chain posture, measured in public. Publishes
# results to the public Scorecard API and uploads SARIF to GitHub code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 5 * * 1'   # weekly, Monday 05:30 UTC
  push:
    branches: [main]

# Least privilege by default; the analysis job opts into exactly what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Results can only be published from the canonical repository, not from forks.
    if: github.repository == 'MaxsysLab/skillwarden'
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results to the public Scorecard API
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results lights up the README badge; it needs id-token: write.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: results.sarif
